<div class="home-container">

    <h1>Products</h1>
    <div class="product-grid">

        <div
            class="product-card"
            *ngFor="let product of products"
        >

            <img
                [src]="product.imageUrl"
                alt="product image"
            >

            <h2>
                {{ product.name }}
            </h2>

            <p>
                Giá bán:
                {{ product.sellPrice }}
            </p>

            <p>
                Số lượng:
                {{ product.quantity }}
            </p>

        </div>

    </div>

</div>
